name: Reusable Test

on:
  workflow_call:
    inputs:
      service-path:
        required: true
        type: string
      node-version:
        required: false
        type: string
        default: '20'

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
      - name: Install dependencies
        run: |
          cd ${{ inputs.service-path }}
          npm ci
      - name: Run tests
        run: |
          cd ${{ inputs.service-path }}
          npm test
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.service-path }}-results
          path: ${{ inputs.service-path }}/test-results
