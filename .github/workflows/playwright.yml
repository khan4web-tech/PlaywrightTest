name: Playwright Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test-native:
    name: Test (${{ matrix.os }} - Native)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm test

  test-docker:
    name: Test (Ubuntu - Docker)
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.45.0-focal

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Playwright tests
        run: npm test
