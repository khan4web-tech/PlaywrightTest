name: Playwright Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - name: "Ubuntu (Native)"
            os: ubuntu-latest
            use-container: false
          - name: "Windows (Native)"
            os: windows-latest
            use-container: false
          - name: "Ubuntu (Docker)"
            os: ubuntu-latest
            use-container: true
            container-image: mcr.microsoft.com/playwright:v1.45.0-focal
          - name: "Windows (Docker)"
            os: windows-latest
            use-container: true
            container-image: mcr.microsoft.com/playwright:v1.45.0-windows

    container: ${{ matrix.use-container && fromJson(format('{{\"image\": \"{0}\"}}', matrix.container-image)) || null }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
        if: ${{ !matrix.use-container }}

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers (Native only)
        run: npx playwright install --with-deps
        if: ${{ !matrix.use-container }}

      - name: Run Playwright tests
        run: npm test
